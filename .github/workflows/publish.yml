name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish with --dry-run (nothing is published)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        if: github.event_name == 'push'
        run: |
          if ! git branch -r --contains "${GITHUB_SHA}" | grep -qE 'origin/master$'; then
            echo "Tag ${GITHUB_REF_NAME} is not on master, refusing to publish."
            exit 1
          fi

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${pkg_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${pkg_version}."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
